<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Asesoría fiscal, laboral y contable en Laguardia (Álava). Ayudamos a autónomos y empresas. Contacta con expertos desde 2013." />
        <link rel="icon" type="image/png" href="/logo.png" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Argomaniz y García Asesores" />
        <meta property="og:locale" content="es_ES" />
        <meta property="og:title" content="Asesoría en Laguardia (Álava) | Fiscal, Laboral y Contable" />
        <meta property="og:description" content="Asesoría fiscal, laboral y contable en Laguardia (Álava). Ayudamos a autónomos y empresas. Contacta con expertos desde 2013." />
        <meta property="og:url" content="https://www.ayg-asesores.com/" />
        <meta property="og:image" content="https://www.ayg-asesores.com/logo.png" />
        <meta name="twitter:card" content="summary" />
        <title>Asesoría en Laguardia (Álava) | Fiscal, Laboral y Contable</title>
        <!-- Ficha del negocio para Google: con esto puede enseñar la dirección,
             los teléfonos y el horario en los resultados y en el mapa. Tiene que
             coincidir con lo que pone la web (Contacto y pie) y con la ficha de
             Google Maps: si cambia el horario o un teléfono, se cambia aquí también. -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "AccountingService",
          "name": "Argomaniz y García Asesores",
          "legalName": "Argomaniz y García Asesores, S.L.",
          "url": "https://www.ayg-asesores.com/",
          "logo": "https://www.ayg-asesores.com/logo.png",
          "image": "https://www.ayg-asesores.com/logo.png",
          "description": "Asesoría fiscal, laboral, contable y legal en Laguardia (Álava) para autónomos y empresas de la Rioja Alavesa.",
          "telephone": "+34 945 600 676",
          "email": "info@ayg-asesores.com",
          "foundingDate": "2013",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Calle Mayor 55, 1.º",
            "addressLocality": "Laguardia",
            "addressRegion": "Álava",
            "postalCode": "01300",
            "addressCountry": "ES"
          },
          "contactPoint": [
            { "@type": "ContactPoint", "telephone": "+34 945 600 676", "contactType": "customer service", "availableLanguage": "es" },
            { "@type": "ContactPoint", "telephone": "+34 629 125 142", "contactType": "customer service", "availableLanguage": "es" }
          ],
          "openingHoursSpecification": {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:00",
            "closes": "16:00"
          },
          "areaServed": "Rioja Alavesa"
        }
        </script>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
